<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carregando...</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* Página de vendas publicada pela Sócia Digital: clara, elegante, uma coluna */
  :root{--ac:#B0646F;--ac-esc:#8E4C56;--ac-bg:#F7ECEC;--bg:#FFFCF8;--bg2:#F6EFE7;--tx:#2A2225;--sub:#6E6266;--linha:#EADFD3}
  *{box-sizing:border-box;margin:0;padding:0;min-width:0}
  body{font-family:"Manrope",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px}
  section{padding:56px 0;border-bottom:1px solid var(--linha)}
  section:last-of-type{border-bottom:0}
  h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
  h1{font-size:clamp(34px,6vw,52px)}
  h2{font-size:clamp(26px,4vw,34px);margin-bottom:18px}
  p{margin-bottom:14px}
  ul{list-style:none;display:grid;gap:12px;margin:8px 0 6px}
  ul li{position:relative;padding-left:34px}
  ul li::before{content:"✓";position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
  strong{font-weight:700}
  .topo{background:linear-gradient(180deg,var(--ac-bg),var(--bg));text-align:center;padding:72px 0 64px;border:0}
  .marca{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:18px}
  .sub{font-size:19px;color:var(--sub);max-width:560px;margin:18px auto 30px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:18px 34px;border-radius:14px;box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .15s,background .15s;min-height:56px;text-align:center}
  .btn:hover{background:var(--ac-esc);transform:translateY(-2px)}
  .seguro{display:block;font-size:13.5px;color:var(--sub);margin-top:12px}
  .dor{font-size:19px}
  .caixa{background:var(--bg2);border-radius:20px;padding:30px}
  .garantia{display:flex;gap:20px;align-items:flex-start}
  .selo{flex:none;width:76px;height:76px;border-radius:50%;border:2px solid var(--ac);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px;text-align:center;line-height:1.1}
  .preco{text-align:center}
  .preco .valor{font-family:"Playfair Display",Georgia,serif;font-size:clamp(30px,5vw,42px);font-weight:700;color:var(--ac);margin:8px 0 24px}
  details{border:1px solid var(--linha);border-radius:14px;padding:16px 20px;margin-bottom:12px;background:#fff}
  summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
  summary::after{content:"+";color:var(--ac);font-size:22px;line-height:1}
  details[open] summary::after{content:"–"}
  details p{margin:10px 0 0;color:var(--sub)}
  .final{text-align:center;border:0}
  footer{text-align:center;font-size:13px;color:var(--sub);padding:28px 0 40px}
  .estado{min-height:80vh;display:grid;place-items:center;text-align:center;color:var(--sub);padding:30px}
  @media(max-width:600px){section{padding:44px 0}.topo{padding:52px 0 46px}.garantia{flex-direction:column}.btn{width:100%}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="pg"><div class="estado">Carregando a página...</div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
{
  const CORES = {
    rosa: ["#B0646F", "#8E4C56", "#F7ECEC"], verde: ["#2F6B5A", "#24543F", "#E8F2EE"], azul: ["#2E5C8A", "#22466B", "#E9F0F7"],
    dourado: ["#A9812F", "#86661F", "#F7F0E1"], lilas: ["#7B5EA7", "#604883", "#F0EBF7"],
  };
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[(SUA HIST[ÓO]RIA AQUI|ESPAÇO[^\]]*)\]/gi, "");
  function md(t) {
    let html = "", lista = false;
    for (const bruta of String(t || "").split("\n")) {
      const l = bruta.trim();
      if (!l) { if (lista) { html += "</ul>"; lista = false; } continue; }
      const m = l.match(/^[-*•]\s+(.*)$/) || l.match(/^\d+[.)]\s+(.*)$/);
      if (m) { if (!lista) { html += "<ul>"; lista = true; } html += `<li>${inl(m[1])}</li>`; continue; }
      if (lista) { html += "</ul>"; lista = false; }
      html += `<p>${inl(l)}</p>`;
    }
    return html + (lista ? "</ul>" : "");
  }
  function faq(t) {
    const linhas = String(t || "").split("\n").map((l) => l.trim()).filter(Boolean), itens = [];
    for (const l of linhas) {
      const m = l.match(/^\*\*(.+?)\*\*:?\s*(.*)$/) || l.match(/^\d+[.)]\s*\*\*(.+?)\*\*:?\s*(.*)$/);
      if (m) itens.push({ p: m[1], r: m[2] || "" });
      else if (itens.length) itens[itens.length - 1].r += (itens[itens.length - 1].r ? " " : "") + l;
    }
    return itens.map((i) => `<details><summary>${inl(i.p)}</summary><p>${inl(i.r)}</p></details>`).join("");
  }

  function montar(d) {
    const s = d.secoes || {}, c = CORES[d.cor] || CORES.rosa, link = /^https:\/\//.test(d.checkout || "") ? d.checkout : "#";
    document.documentElement.style.setProperty("--ac", c[0]);
    document.documentElement.style.setProperty("--ac-esc", c[1]);
    document.documentElement.style.setProperty("--ac-bg", c[2]);
    document.title = (s.TITULO || d.produto || "Página de vendas").slice(0, 70);
    const botao = (txt) => `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${txt}</a><span class="seguro">🔒 Compra segura pela Kiwify</span>`;
    const sec = (cls, titulo, corpo) => corpo ? `<section class="${cls}"><div class="wrap">${titulo ? `<h2>${titulo}</h2>` : ""}${corpo}</div></section>` : "";
    document.getElementById("pg").innerHTML = `
      <section class="topo"><div class="wrap">
        ${d.produto ? `<span class="marca">${esc(d.produto)}</span>` : ""}
        <h1>${inl(s.TITULO)}</h1>
        ${s.SUBTITULO ? `<p class="sub">${inl(s.SUBTITULO)}</p>` : ""}
        ${botao("Quero começar agora")}
      </div></section>
      ${sec("dor", "", md(s.DOR))}
      ${sec("", "O que muda para você", md(s.VIRADA))}
      ${sec("", "O que você recebe", `<div class="caixa">${md(s.CONTEUDO)}</div>`)}
      ${sec("", "Bônus", s.BONUS ? `<div class="caixa">${md(s.BONUS)}</div>` : "")}
      ${sec("", d.autora ? `Quem sou eu: ${esc(d.autora)}` : "Quem sou eu", md(s.SOBRE) + (d.arroba ? `<p><strong>${esc(d.arroba.startsWith("@") ? d.arroba : "@" + d.arroba)}</strong> no Instagram</p>` : ""))}
      ${sec("", "", s.GARANTIA ? `<div class="garantia"><div class="selo">GARANTIA</div><div>${md(s.GARANTIA)}</div></div>` : "")}
      <section class="preco"><div class="wrap"><h2>Comece hoje</h2><div class="valor">${inl((s.PRECO || "").split("\n")[0])}</div>${md((s.PRECO || "").split("\n").slice(1).join("\n"))}${botao("Garantir o meu acesso")}</div></section>
      ${sec("", "Perguntas frequentes", faq(s.FAQ))}
      <section class="final"><div class="wrap">${md(s.CHAMADA)}${botao("Quero começar agora")}</div></section>
      <footer>© ${new Date().getFullYear()} ${esc(d.autora || "")}</footer>`;
  }

  const nada = (msg) => { document.getElementById("pg").innerHTML = `<div class="estado">${msg}</div>`; document.title = "Página"; };
  const slug = new URLSearchParams(location.search).get("p");
  const C = window.CONFIG || {};
  if (!slug) nada("Página não encontrada.");
  else if (!C.SUPABASE_URL) {
    let d = null; try { d = JSON.parse(localStorage.getItem("sd_pagina_" + slug) || "null"); } catch {}
    d ? montar(d) : nada("Página não encontrada.");
  } else {
    const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    sb.from("paginas").select("dados").eq("slug", slug).eq("publicada", true).maybeSingle()
      .then(({ data }) => (data?.dados ? montar(data.dados) : nada("Esta página não está disponível.")))
      .catch(() => nada("Não consegui carregar a página. Tente de novo."));
  }
}
</script>
</body>
</html>
